name: Release Obsidian plugin
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node -e 'const fs=require("fs"); const m=require("./manifest.json"); const p=require("./package.json"); const v=require("./versions.json"); const tag=process.env.RELEASE_TAG; if(!/^\d+\.\d+\.\d+$/.test(tag)||m.version!==tag||p.version!==tag||v[tag]!==m.minAppVersion) process.exit(1); for(const f of ["main.js","manifest.json","styles.css"]) if(!fs.existsSync(f)||!fs.statSync(f).size) process.exit(1);'
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" main.js manifest.json styles.css
