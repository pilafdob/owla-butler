# Developer-Prerelease release pipeline. This file lives only on the dev
# branch and is never merged into main. Every release it creates is a
# prerelease and is never marked "latest" (--prerelease --latest=false).
# Tags must be <stable>-dev.<n>; version numbers are not bumped here, and the
# changelog is generated by scripts/dev-release.mjs from main's manifest.
# Stable releases are tagged on main, which keeps its own copy of this file.
name: Release Obsidian plugin
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run guard:test
      - run: npm run build
      - run: npm run check:release
      - name: Package direct-install distribution
        run: node scripts/package.mjs
      - name: Verify dev release metadata and changelog
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          git fetch --depth=1 origin main
          node scripts/dev-release.mjs
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            dist/*.zip
      - name: Store optional manual-install package separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owla-butler-manual-install
          path: dist/owla-butler-*
          if-no-files-found: error
      - name: Create draft prerelease (never latest)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" --draft --prerelease --latest=false --title "OWLA Butler $RELEASE_TAG" --notes-file DEV-RELEASE-NOTES.md main.js manifest.json styles.css
