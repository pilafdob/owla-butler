# Publishes the static promotional site in site/ to GitHub Pages
# (Settings -> Pages -> Source: GitHub Actions). The plugin bundle is not
# built or changed here.
#
# Upload and deploy are separate jobs, as in GitHub's own Pages starter
# workflows: the deploy job starts only after the artifact is finalized, and
# "Re-run failed jobs" re-runs only the deploy, so a run never holds two
# github-pages artifacts.
name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
