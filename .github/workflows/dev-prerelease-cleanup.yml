# Developer-Prerelease only. When a dev release (<version>-dev or
# <version>-dev.<n>) is published as a prerelease, every OTHER published
# release whose tag is a dev tag loses its "Pre-release" flag, so only the
# newest dev build carries it. Runs on publish, not on draft creation, so a
# flagged dev release exists at all times. --latest=false keeps a demoted dev
# build from becoming "Latest"; stable releases are never touched.
name: Keep Pre-release flag on newest dev release only
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: dev-prerelease-cleanup
  cancel-in-progress: false
jobs:
  demote:
    if: github.event.release.prerelease && contains(github.event.release.tag_name, '-dev')
    runs-on: ubuntu-latest
    steps:
      - name: Clear Pre-release flag on older dev releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == true) | .tag_name' |
          while read -r tag; do
            [ "$tag" = "$CURRENT_TAG" ] && continue
            case "$tag" in
              *-dev|*-dev.*) ;;
              *) continue ;;
            esac
            echo "Clearing Pre-release flag on $tag"
            gh release edit "$tag" --prerelease=false --latest=false
          done
