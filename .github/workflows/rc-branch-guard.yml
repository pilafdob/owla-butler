# One-way branch guard: OWLA-RC is where new features and fixes are made and
# is merged into main, but nothing is ever merged into OWLA-RC. This check
# fails any pull request whose base is OWLA-RC; pull requests whose head is
# OWLA-RC and whose base is main are allowed. The "Block merges into OWLA-RC"
# check is required by the "OWLA-RC" branch ruleset. A pull request runs the
# workflow file from its base/head merge ref, so this file must stay on
# OWLA-RC (it reaches main with the next merge, where it is harmless).
name: RC branch guard
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions: {}
jobs:
  block-merges-into-rc:
    name: Block merges into OWLA-RC
    runs-on: ubuntu-latest
    steps:
      - name: Refuse pull requests targeting OWLA-RC
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "OWLA-RC" ]; then
            echo "::error::OWLA-RC is a one-way branch: commit new features and fixes directly to it and merge it into main. Nothing may be merged into OWLA-RC. Close this pull request. See CONTRIBUTING.md (OWLA-RC branch)."
            exit 1
          fi
          echo "Pull request head '$HEAD_REF' -> '$BASE_REF' is allowed."
