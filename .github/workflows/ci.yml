name: Check plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run guard:test
      - run: npm run build
      - run: npm run check:release
      - name: Verify plugin assets
        run: node -e 'const fs=require("fs"); for(const f of ["main.js","manifest.json","styles.css"]) if(!fs.existsSync(f)||!fs.statSync(f).size) process.exit(1);'
